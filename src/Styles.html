<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1c2630; --muted: #5b6875; --line: #dde3e9;
    --brand: #0b6b57; --brand-text: #ffffff; --danger: #b3261e; --ok: #1b7a3d; --chip: #e7f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171c; --card: #1b232b; --text: #e8edf1; --muted: #9aa7b3; --line: #2c3742;
      --brand: #3fb59a; --brand-text: #08201a; --danger: #ff8a80; --ok: #6fd18d; --chip: #1f3a33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: .92rem; }
  .center { text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin: 12px 0; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=search], select, textarea {
    width: 100%; padding: 12px; font-size: 1rem; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; }
  textarea { min-height: 90px; font-family: ui-monospace, monospace; font-size: .85rem; }
  button { font: inherit; font-weight: 600; padding: 12px 16px; border-radius: 10px; border: 0;
    background: var(--brand); color: var(--brand-text); cursor: pointer; min-height: 44px; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.small { padding: 6px 10px; min-height: 36px; font-size: .88rem; }
  button.block { width: 100%; margin-top: 16px; }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: var(--danger); margin-top: 10px; font-size: .95rem; }
  .okmsg { color: var(--ok); margin-top: 10px; font-size: .95rem; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px;
    padding: 2px 10px; font-size: .8rem; }
  .sugg { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  .sugg button { width: 100%; text-align: left; background: var(--card); color: var(--text);
    border-radius: 0; border-bottom: 1px solid var(--line); font-weight: 500; }
  .sugg small { display: block; color: var(--muted); }
  .user { border-top: 1px solid var(--line); padding: 12px 0; }
  .user:first-child { border-top: 0; }
  .user b { display: block; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 8px 0; }
  .check input { width: 20px; height: 20px; }
  details summary { cursor: pointer; font-weight: 600; }
</style>
