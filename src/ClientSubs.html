<script>
(function () {
  'use strict';
  var A = window.App;
  var h = A.h, mount = A.mount, call = A.call;
  var metaCache = null;
  var photoCache = {};

  function sessionGuard(r) {
    if (r && !r.ok && r.code === 'SESSION') { A.logout(r.error); return true; }
    return false;
  }

  function loadMeta() {
    if (metaCache) return Promise.resolve(metaCache);
    return call('meta').then(function (r) {
      if (r.ok) metaCache = r.data;
      return r.ok ? r.data : null;
    });
  }

  var materialsPromise = null;
  function loadMaterials() {
    if (!materialsPromise) {
      materialsPromise = call('materials.all').then(function (r) { return r.ok ? r.data.items : []; });
    }
    return materialsPromise;
  }

  // Cari berdasarkan No. Material atau kata dalam deskripsi (semua kata harus cocok)
  function searchMaterials(list, q) {
    var words = q.toLowerCase().split(/\s+/).filter(Boolean), out = [];
    for (var i = 0; i < list.length && out.length < 8; i++) {
      var hay = (list[i][0] + ' ' + list[i][1]).toLowerCase();
      if (words.every(function (w) { return hay.indexOf(w) >= 0; })) out.push(list[i]);
    }
    return out;
  }

  function statusChip(status) {
    var cls = 'st';
    if (status === 'Disetujui' || status === 'Selesai') cls += ' good';
    else if (status === 'Ditolak' || status === 'Dibatalkan') cls += ' bad';
    else if (status.indexOf('Menunggu') === 0) cls += ' warn';
    return h('span', { class: cls, text: status });
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
  }

  // ---------- foto ----------
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1280, w = img.naturalWidth, hgt = img.naturalHeight;
        var sc = Math.min(1, max / Math.max(w, hgt));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * sc));
        c.height = Math.max(1, Math.round(hgt * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Foto tidak bisa dibaca.')); };
      img.src = url;
    });
  }

  function loadPhotoInto(img, subId, fileId) {
    var key = fileId;
    if (photoCache[key]) { img.src = photoCache[key]; return; }
    call('sub.photo', { id: subId, fileId: fileId }).then(function (r) {
      if (r.ok) { photoCache[key] = r.data.dataUrl; img.src = r.data.dataUrl; }
    });
  }

  // ---------- daftar di beranda ----------
  function mineList(box) {
    call('sub.list').then(function (r) {
      box.innerHTML = '';
      if (!r.ok) { if (!sessionGuard(r)) box.appendChild(h('p', { class: 'err', text: r.error })); return; }
      box.appendChild(h('h2', { text: 'Pengajuan saya' }));
      if (!r.data.length) { box.appendChild(h('p', { class: 'muted', text: 'Belum ada pengajuan.' })); return; }
      r.data.forEach(function (s) {
        box.appendChild(h('button', { class: 'listitem', onclick: function () { viewDetail(s.id); } }, [
          h('span', {}, [s.number || 'Draft', ' ', statusChip(s.status)]),
          h('small', { text: s.itemCount + ' item' + (s.firstItem ? ' · ' + s.firstItem : '') + ' · ' + fmtDate(s.updatedAt) })
        ]));
      });
    });
  }

  function listRow(s, withWho) {
    return h('button', { class: 'listitem', onclick: function () { viewDetail(s.id); } }, [
      h('span', {}, [s.number || 'Draft', ' ', statusChip(s.status)]),
      h('small', { text: (withWho ? s.requesterName + ' · ' + s.department + ' · ' : '') + s.itemCount + ' item' +
        (s.firstItem ? ' · ' + s.firstItem : '') + ' · ' + fmtDate(s.updatedAt) })
    ]);
  }

  function inboxList(box) {
    call('inbox').then(function (r) {
      if (!r.ok || !r.data.length) { box.style.display = 'none'; return; }
      box.style.display = '';
      box.innerHTML = '';
      box.appendChild(h('h2', { text: 'Menunggu tindakan Anda (' + r.data.length + ')' }));
      r.data.forEach(function (s) { box.appendChild(listRow(s, true)); });
    });
  }

  function viewAll() {
    var list = h('div', { class: 'card' }, [h('p', { class: 'muted', text: 'Memuat...' })]);
    var q = h('input', { type: 'search', placeholder: 'Cari nomor / nama / departemen / item' });
    var statuses = ['', 'Menunggu Dept Head', 'Menunggu Logistic', 'Disetujui', 'Selesai', 'Ditolak', 'Dibatalkan'];
    var st = h('select', {}, statuses.map(function (x) { return h('option', { value: x, text: x || 'Semua status' }); }));
    var data = [];
    function render() {
      var f = q.value.trim().toLowerCase(), sv = st.value;
      var rows = data.filter(function (s) {
        return (!sv || s.status === sv) &&
          (!f || (s.number + ' ' + s.requesterName + ' ' + s.department + ' ' + s.firstItem).toLowerCase().indexOf(f) >= 0);
      });
      list.innerHTML = '';
      list.appendChild(h('p', { class: 'muted', text: rows.length + ' pengajuan' }));
      rows.slice(0, 100).forEach(function (s) { list.appendChild(listRow(s, true)); });
      if (rows.length > 100) list.appendChild(h('p', { class: 'muted', text: 'Menampilkan 100 pertama. Persempit pencarian.' }));
    }
    q.addEventListener('input', render); st.addEventListener('change', render);
    mount(
      h('div', { class: 'bar' }, [h('h1', { text: 'Semua Pengajuan' }), h('button', { class: 'secondary small', text: 'Kembali', onclick: A.viewHome })]),
      h('div', { class: 'card' }, [q, h('div', { style: 'height:8px' }), st]),
      list
    );
    call('sub.listVisible').then(function (r) {
      if (!r.ok) { if (!sessionGuard(r)) list.textContent = r.error; return; }
      data = r.data; render();
    });
  }

  // ---------- Deputy ----------
  function viewDeputy() {
    var box = h('div');
    mount(
      h('div', { class: 'bar' }, [h('h1', { text: 'Pengaturan Deputy' }), h('button', { class: 'secondary small', text: 'Kembali', onclick: A.viewHome })]),
      h('p', { class: 'muted', text: 'Deputy dapat menyetujui pengajuan departemen Anda. Berlaku sampai Anda mencabutnya.' }),
      box
    );
    call('dept.mine').then(function (r) {
      if (!r.ok) { if (!sessionGuard(r)) box.textContent = r.error; return; }
      if (!r.data.length) box.appendChild(h('div', { class: 'card' }, [h('p', { class: 'muted', text: 'Anda belum tercatat sebagai Dept. Head departemen mana pun. Hubungi admin.' })]));
      r.data.forEach(function (d) { box.appendChild(deputyCard(d)); });
    });
  }

  function deputyCard(d) {
    var msg = h('div', { class: 'muted' });
    var sel = h('select', {}, [h('option', { value: '', text: '— tanpa Deputy —' })].concat(
      d.candidates.map(function (c) { return h('option', { value: c.nik, text: c.name + ' (' + c.nik + ')' }); })));
    sel.value = d.deputyNik || '';
    var cur = h('p', { text: d.deputyName ? 'Deputy saat ini: ' + d.deputyName : 'Belum ada Deputy.' });
    var btn = h('button', { class: 'block', text: 'Simpan', onclick: function () {
      btn.disabled = true;
      call('dept.setDeputy', { department: d.department, nik: sel.value }).then(function (r) {
        btn.disabled = false;
        if (r.ok) { cur.textContent = r.data.deputyName ? 'Deputy saat ini: ' + r.data.deputyName : 'Belum ada Deputy.'; msg.className = 'okmsg'; msg.textContent = 'Tersimpan.'; }
        else if (!sessionGuard(r)) { msg.className = 'err'; msg.textContent = r.error; }
      });
    } });
    return h('div', { class: 'card' }, [h('h2', { text: d.department }), cur, h('label', { text: 'Pilih Deputy' }), sel, btn, msg]);
  }

  // ---------- form ----------
  function blankItem() { return { materialNo: '', description: '', qty: '', uom: '', uomOther: '', reason: '' }; }

  function viewForm(id) {
    mount(h('p', { class: 'muted center', text: 'Memuat...' }));
    Promise.all([loadMeta(), id ? call('sub.get', { id: id }) : Promise.resolve(null)]).then(function (res) {
      var meta = res[0], existing = res[1];
      if (!meta) { mount(h('p', { class: 'err', text: 'Gagal memuat data. Coba lagi.' }), h('button', { text: 'Kembali', onclick: A.viewHome })); return; }
      if (existing && !existing.ok) { if (!sessionGuard(existing)) viewHome(existing.error); return; }
      var form = existing ? fromView(existing.data, meta) : { id: null, source: '', sourceOther: '', items: [blankItem()], photos: [] };
      renderForm(meta, form);
    });
  }

  function viewHome(msg) { A.viewHome(); if (msg) window.alert(msg); }

  function fromView(v, meta) {
    return {
      id: v.id, source: v.source, sourceOther: v.sourceOther,
      items: v.items.map(function (i) {
        var known = meta.uoms.indexOf(i.uom) >= 0;
        return {
          materialNo: i.materialNo, description: i.description, qty: String(i.qty).replace('.', ','),
          uom: known ? i.uom : meta.uomOther, uomOther: known ? '' : i.uom, reason: i.reason
        };
      }),
      photos: v.photos.map(function (p) { return { fileId: p.fileId, name: p.name, uploaded: true }; }),
      removed: []
    };
  }

  function renderForm(meta, form) {
    form.removed = form.removed || [];
    var msg = h('div', { class: 'err' });
    var busy = false;

    function field(label, input) { return h('div', {}, [h('label', { text: label }), input]); }

    function bind(input, obj, key) {
      input.value = obj[key] || '';
      input.addEventListener('input', function () { obj[key] = input.value; });
      return input;
    }

    var srcSel = h('select', {}, [h('option', { value: '', text: '— pilih —' })].concat(
      meta.sources.map(function (s) { return h('option', { value: s, text: s }); })));
    srcSel.value = form.source;
    var srcOther = h('input', { type: 'text', placeholder: 'Jelaskan sumber scrap' });
    bind(srcOther, form, 'sourceOther');
    var srcOtherBox = field('Keterangan Sumber (Other)', srcOther);
    function syncSource() { srcOtherBox.style.display = form.source === 'Other' ? '' : 'none'; }
    srcSel.addEventListener('change', function () { form.source = srcSel.value; syncSource(); });
    syncSource();

    var itemsBox = h('div');
    function renderItems() {
      itemsBox.innerHTML = '';
      form.items.forEach(function (it, idx) {
        var uom = h('select', {}, [h('option', { value: '', text: '— UoM —' })]
          .concat(meta.uoms.map(function (u) { return h('option', { value: u, text: u }); }))
          .concat([h('option', { value: meta.uomOther, text: 'Other (ketik sendiri)' })]));
        uom.value = it.uom;
        var uomOther = bind(h('input', { type: 'text', placeholder: 'UoM', maxlength: '20' }), it, 'uomOther');
        var uomOtherWrap = h('div', {}, [uomOther]);
        function syncUom() { uomOtherWrap.style.display = it.uom === meta.uomOther ? '' : 'none'; }
        uom.addEventListener('change', function () { it.uom = uom.value; syncUom(); });
        syncUom();

        var search = h('input', { type: 'search', placeholder: 'Cari material SAP (no. atau nama), opsional', autocomplete: 'off' });
        var sugg = h('ul', { class: 'sugg', style: 'display:none' });
        var stimer = null;
        search.addEventListener('input', function () {
          clearTimeout(stimer);
          var q = search.value.trim();
          if (q.length < 3) { sugg.style.display = 'none'; return; }
          stimer = setTimeout(function () {
            loadMaterials().then(function (list) {
              var hits = searchMaterials(list, q);
              sugg.innerHTML = '';
              sugg.style.display = hits.length ? '' : 'none';
              hits.forEach(function (m) {
                sugg.appendChild(h('li', {}, [h('button', { type: 'button', onclick: function () {
                  it.materialNo = m[0]; it.description = m[1];
                  if (m[2] && meta.uoms.indexOf(m[2]) >= 0) { it.uom = m[2]; it.uomOther = ''; }
                  else if (m[2]) { it.uom = meta.uomOther; it.uomOther = m[2]; }
                  renderItems();
                } }, [m[1], h('small', { text: m[0] + (m[2] ? ' · ' + m[2] : '') })])]));
              });
            });
          }, 250);
        });

        itemsBox.appendChild(h('div', { class: 'item' }, [
          h('div', { class: 'head' }, [
            h('b', { text: 'Item ' + (idx + 1) }),
            form.items.length > 1 ? h('button', { class: 'secondary small', type: 'button', text: 'Hapus',
              onclick: function () { form.items.splice(idx, 1); renderItems(); } }) : null
          ]),
          h('div', {}, [search, sugg]),
          field('No. Material (opsional)', bind(h('input', { type: 'text', inputmode: 'numeric', maxlength: '40' }), it, 'materialNo')),
          field('Material Description *', bind(h('input', { type: 'text', maxlength: '200' }), it, 'description')),
          h('div', { class: 'two' }, [
            field('Qty *', bind(h('input', { type: 'text', inputmode: 'decimal', placeholder: 'mis. 2,5' }), it, 'qty')),
            field('UoM *', uom)
          ]),
          uomOtherWrap,
          field('Scrap Reason *', bind(h('textarea', { maxlength: '500' }), it, 'reason'))
        ]));
      });
    }
    renderItems();

    var thumbs = h('div', { class: 'thumbs' });
    function renderPhotos() {
      thumbs.innerHTML = '';
      form.photos.forEach(function (p, idx) {
        var img = h('img', { alt: 'foto ' + (idx + 1) });
        if (p.dataUrl) img.src = p.dataUrl; else loadPhotoInto(img, form.id, p.fileId);
        thumbs.appendChild(h('div', { class: 'thumb' }, [img, h('button', { type: 'button', text: '×', title: 'Hapus foto',
          onclick: function () {
            if (p.fileId) form.removed.push(p.fileId);
            form.photos.splice(idx, 1); renderPhotos();
          } })]));
      });
      addBtn.disabled = form.photos.length >= meta.maxPhotos;
      count.textContent = form.photos.length + ' / ' + meta.maxPhotos + ' foto (minimal 1)';
    }
    var count = h('div', { class: 'muted' });
    var file = h('input', { type: 'file', accept: 'image/*', multiple: true, style: 'display:none' });
    var addBtn = h('button', { class: 'secondary', type: 'button', text: '+ Tambah foto', onclick: function () { file.click(); } });
    file.addEventListener('change', function () {
      var files = Array.prototype.slice.call(file.files);
      file.value = '';
      var room = meta.maxPhotos - form.photos.length;
      if (files.length > room) { msg.textContent = 'Maksimal ' + meta.maxPhotos + ' foto.'; files = files.slice(0, Math.max(0, room)); }
      files.reduce(function (chain, f) {
        return chain.then(function () {
          return compress(f).then(function (dataUrl) {
            form.photos.push({ dataUrl: dataUrl, name: f.name });
            renderPhotos();
          });
        });
      }, Promise.resolve()).catch(function (e) { msg.textContent = e.message; });
    });
    renderPhotos();

    function payload() {
      return {
        id: form.id, source: form.source, sourceOther: form.sourceOther,
        items: form.items.map(function (i) {
          return { materialNo: i.materialNo, description: i.description, qty: i.qty, uom: i.uom, uomOther: i.uomOther, reason: i.reason };
        })
      };
    }

    async function persist(submit) {
      if (busy) return;
      msg.className = 'err'; msg.textContent = '';
      if (submit && !form.photos.length) { msg.textContent = 'Unggah minimal 1 foto.'; return; }
      busy = true; setButtons(true);
      try {
        msg.className = 'muted'; msg.textContent = 'Menyimpan...';
        var r = await call('sub.save', payload());
        if (!r.ok) throw r;
        form.id = r.data.id;
        while (form.removed.length) {
          var rid = form.removed[0];
          var rr = await call('sub.removePhoto', { id: form.id, fileId: rid });
          if (!rr.ok) throw rr;
          form.removed.shift();
        }
        for (var i = 0; i < form.photos.length; i++) {
          var p = form.photos[i];
          if (p.uploaded) continue;
          msg.textContent = 'Mengunggah foto ' + (i + 1) + ' dari ' + form.photos.length + '...';
          var ur = await call('sub.addPhoto', { id: form.id, name: p.name, data: p.dataUrl });
          if (!ur.ok) throw ur;
          p.fileId = ur.data.fileId; p.uploaded = true;
        }
        if (submit) {
          msg.textContent = 'Mengirim pengajuan...';
          var sr = await call('sub.submit', { id: form.id });
          if (!sr.ok) throw sr;
        }
        busy = false;
        viewDetail(form.id, submit ? 'Pengajuan terkirim.' : 'Draft tersimpan.');
      } catch (e) {
        busy = false; setButtons(false);
        if (e && e.code === 'SESSION') { A.logout(e.error); return; }
        msg.className = 'err';
        msg.textContent = (e && e.error) || (e && e.message) || 'Gagal menyimpan. Coba lagi.';
      }
    }

    var btnDraft = h('button', { class: 'secondary', type: 'button', text: 'Simpan Draft', onclick: function () { persist(false); } });
    var btnSend = h('button', { type: 'button', text: 'Kirim Pengajuan', onclick: function () {
      if (window.confirm('Kirim pengajuan sekarang? Setelah dikirim tidak bisa diubah kecuali ditolak.')) persist(true);
    } });
    function setButtons(disabled) { btnDraft.disabled = disabled; btnSend.disabled = disabled; addBtn.disabled = disabled || form.photos.length >= meta.maxPhotos; }

    mount(
      h('div', { class: 'bar' }, [
        h('h1', { text: form.id ? 'Ubah Draft' : 'Pengajuan Baru' }),
        h('button', { class: 'secondary small', type: 'button', text: 'Kembali', onclick: function () {
          if (window.confirm('Keluar dari form? Isian yang belum disimpan akan hilang.')) (form.id ? viewDetail(form.id) : A.viewHome());
        } })
      ]),
      h('div', { class: 'card' }, [field('Sumber Scrap *', srcSel), srcOtherBox]),
      h('div', { class: 'card' }, [
        h('h2', { text: 'Item scrap' }), itemsBox,
        h('button', { class: 'secondary', type: 'button', text: '+ Tambah item', onclick: function () {
          if (form.items.length >= meta.maxItems) { msg.textContent = 'Maksimal ' + meta.maxItems + ' item.'; return; }
          form.items.push(blankItem()); renderItems();
        } })
      ]),
      h('div', { class: 'card' }, [h('h2', { text: 'Foto scrap *' }), thumbs, count, addBtn, file]),
      h('div', { class: 'card' }, [msg, h('div', { class: 'row' }, [btnDraft, btnSend])])
    );
  }

  // ---------- detail ----------
  function viewDetail(id, notice) {
    mount(h('p', { class: 'muted center', text: 'Memuat...' }));
    call('sub.get', { id: id }).then(function (r) {
      if (!r.ok) {
        if (sessionGuard(r)) return;
        mount(h('p', { class: 'err', text: r.error }), h('button', { text: 'Kembali', onclick: A.viewHome }));
        return;
      }
      var v = r.data;
      var can = function (a) { return v.actions.indexOf(a) >= 0; };

      var thumbs = h('div', { class: 'thumbs' });
      v.photos.forEach(function (p, i) {
        var img = h('img', { alt: 'foto ' + (i + 1) });
        thumbs.appendChild(h('div', { class: 'thumb' }, [img]));
        loadPhotoInto(img, v.id, p.fileId);
      });

      var info = [
        h('p', { class: 'muted', text: v.requesterName + ' · ' + v.department }),
        h('p', {}, ['Sumber: ', h('b', { text: v.source + (v.sourceOther ? ' (' + v.sourceOther + ')' : '') })]),
        h('p', { class: 'muted', text: v.submittedAt ? 'Diajukan ' + fmtDate(v.submittedAt) : 'Dibuat ' + fmtDate(v.createdAt) })
      ];
      if (v.waitingFor) info.push(h('p', {}, ['Menunggu: ', h('b', { text: v.waitingFor })]));

      mount(
        h('div', { class: 'bar' }, [h('h1', { text: v.number || 'Draft' }), statusChip(v.status)]),
        notice ? h('div', { class: 'okmsg', text: notice }) : null,
        (v.lastNote && (v.status === 'Ditolak' || v.status === 'Dibatalkan'))
          ? h('div', { class: 'card' }, [h('b', { class: 'err', text: v.status === 'Ditolak' ? 'Alasan penolakan' : 'Catatan pembatalan' }), h('p', { text: v.lastNote })])
          : null,
        h('div', { class: 'card' }, info),
        h('div', { class: 'card' }, [h('h2', { text: 'Item (' + v.items.length + ')' })].concat(v.items.map(function (i) {
          return h('div', { class: 'item' }, [
            h('b', { text: i.line + '. ' + i.description }),
            h('div', { class: 'muted', text: (i.materialNo ? 'No. Material ' + i.materialNo + ' · ' : '') + String(i.qty).replace('.', ',') + ' ' + i.uom }),
            h('div', { text: 'Alasan: ' + i.reason })
          ]);
        }))),
        h('div', { class: 'card' }, [h('h2', { text: 'Foto (' + v.photos.length + ')' }), thumbs]),
        actionCard(v, can),
        v.status !== 'Draft' ? pdfCard(v) : null,
        h('div', { class: 'card' }, [h('h2', { text: 'Riwayat' })].concat((v.history || []).map(function (e) {
          return h('div', { class: 'hist' }, [h('b', { text: e.action }), ' · ' + e.byName + ' · ' + fmtDate(e.at) + (e.note ? ' · ' + e.note : '')]);
        }))),
        h('button', { class: 'secondary block', text: 'Kembali', onclick: A.viewHome })
      );
    });
  }

  // PDF formulir (tanda tangan basah). Dibuat di server, diunduh sebagai file.
  function pdfCard(v) {
    var msg = h('div', { class: 'muted' });
    var slot = h('div');
    var btn = h('button', { class: 'secondary', text: 'Cetak / Unduh PDF' });
    btn.addEventListener('click', function () {
      btn.disabled = true; msg.className = 'muted'; msg.textContent = 'Menyiapkan PDF...'; slot.innerHTML = '';
      call('sub.pdf', { id: v.id }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { if (!sessionGuard(r)) { msg.className = 'err'; msg.textContent = r.error; } return; }
        var bin = atob(r.data.base64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        var a = h('a', { href: url, download: r.data.filename, target: '_blank', rel: 'noopener', text: 'Unduh ' + r.data.filename });
        a.style.display = 'inline-block'; a.style.marginTop = '8px';
        slot.appendChild(a);
        msg.className = 'okmsg'; msg.textContent = 'PDF siap. Ketuk tautan di bawah jika unduhan tidak mulai otomatis.';
        try { a.click(); } catch (e) { /* tautan manual tetap ada */ }
      });
    });
    return h('div', { class: 'card' }, [h('h2', { text: 'Formulir' }),
      h('p', { class: 'muted', text: 'PDF A4 dengan kolom tanda tangan basah: Pemohon, Dept. Head, Logistic Staff (penerima), Logistic Dept. Head.' }),
      btn, msg, slot]);
  }

  // Tombol aksi sesuai hak. Tolak wajib alasan, batal boleh beralasan.
  function actionCard(v, can) {
    var card = h('div', { class: 'card' });
    var msg = h('div', { class: 'err' });
    var reason = h('textarea', { placeholder: 'Alasan', maxlength: '500' });
    var reasonBox = h('div', { style: 'display:none' }, [h('label', { text: 'Alasan' }), reason]);
    var pending = null;
    var confirmBtn = h('button', { class: 'block', style: 'display:none', text: 'Konfirmasi' });
    var row = h('div', { class: 'row' });

    function run(action, note) {
      msg.textContent = '';
      confirmBtn.disabled = true;
      call('sub.act', { id: v.id, action: action, note: note || '' }).then(function (r) {
        confirmBtn.disabled = false;
        if (r.ok) { viewDetail(v.id, { approve: 'Disetujui.', reject: 'Pengajuan ditolak.', receive: 'Scrap dikonfirmasi diterima. Pengajuan selesai.', cancel: 'Pengajuan dibatalkan.', reopen: 'Dibuka kembali sebagai Draft.' }[action]); return; }
        if (!sessionGuard(r)) msg.textContent = r.error;
      });
    }
    function askReason(action, label, required) {
      pending = { action: action, required: required };
      reasonBox.style.display = '';
      reason.placeholder = required ? 'Alasan (wajib)' : 'Alasan (opsional)';
      confirmBtn.style.display = '';
      confirmBtn.textContent = label;
      reason.focus();
    }
    confirmBtn.addEventListener('click', function () {
      if (!pending) return;
      if (pending.required && !reason.value.trim()) { msg.textContent = 'Alasan wajib diisi.'; return; }
      run(pending.action, reason.value);
    });

    if (can('edit')) row.appendChild(h('button', { text: 'Ubah / Kirim', onclick: function () { viewForm(v.id); } }));
    if (can('delete')) row.appendChild(h('button', { class: 'secondary', text: 'Hapus draft', onclick: function () {
      if (!window.confirm('Hapus draft ini?')) return;
      call('sub.deleteDraft', { id: v.id }).then(function (d) {
        if (d.ok) A.viewHome(); else if (!sessionGuard(d)) msg.textContent = d.error;
      });
    } }));
    if (can('approve')) row.appendChild(h('button', { text: 'Setujui', onclick: function () {
      if (window.confirm('Setujui pengajuan ' + v.number + '?')) run('approve', '');
    } }));
    if (can('receive')) row.appendChild(h('button', { text: 'Konfirmasi Diterima', onclick: function () {
      if (window.confirm('Konfirmasi scrap fisik sudah diterima? Pengajuan akan Selesai dan tidak bisa dibatalkan.')) run('receive', '');
    } }));
    if (can('reject')) row.appendChild(h('button', { class: 'secondary', text: 'Tolak', onclick: function () { askReason('reject', 'Konfirmasi tolak', true); } }));
    if (can('cancel')) row.appendChild(h('button', { class: 'secondary', text: 'Batalkan pengajuan', onclick: function () { askReason('cancel', 'Konfirmasi batal', false); } }));
    if (can('reopen')) row.appendChild(h('button', { text: 'Buka kembali (perbaiki)', onclick: function () {
      if (window.confirm('Buka kembali sebagai Draft? Setelah diperbaiki dan dikirim ulang, approval mulai dari awal.')) run('reopen', '');
    } }));

    if (!row.childNodes.length) return h('div');
    card.appendChild(h('h2', { text: 'Tindakan' }));
    card.appendChild(row);
    card.appendChild(reasonBox);
    card.appendChild(confirmBtn);
    card.appendChild(msg);
    return card;
  }

  A.subs = { mineList: mineList, inboxList: inboxList, viewAll: viewAll, viewDeputy: viewDeputy, viewForm: viewForm, viewDetail: viewDetail };
})();
</script>
